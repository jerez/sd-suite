name: Release plugins

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch, tag, or commit to release
        required: true
        default: main
        type: string
      plugins:
        description: Plugin name, comma-separated names, or all
        required: true
        default: all
        type: string
      release_kind:
        description: GitHub release maturity
        required: true
        default: rc
        type: choice
        options:
          - rc
          - stable
      notes:
        description: Optional release notes applied to every selected plugin
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-plugins-${{ inputs.ref }}-${{ inputs.release_kind }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan plugin releases
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      native: ${{ steps.plan.outputs.native }}
      plugins: ${{ steps.plan.outputs.plugins }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
          standalone: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release source
        id: source
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=7 "$source_sha")"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Build release plan
        id: plan
        env:
          PLUGIN_SELECTION: ${{ inputs.plugins }}
          RELEASE_KIND: ${{ inputs.release_kind }}
          SHORT_SHA: ${{ steps.source.outputs.short_sha }}
        run: |
          plan_file="$RUNNER_TEMP/plugin-release-plan.json"
          pnpm --silent release:plan \
            --plugins "$PLUGIN_SELECTION" \
            --kind "$RELEASE_KIND" \
            --sha "$SHORT_SHA" > "$plan_file"
          echo "native=$(jq -c '.native' "$plan_file")" >> "$GITHUB_OUTPUT"
          echo "plugins=$(jq -c '.plugins' "$plan_file")" >> "$GITHUB_OUTPUT"

      - name: Reject existing release identities
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES: ${{ steps.plan.outputs.plugins }}
        shell: bash
        run: |
          while IFS= read -r tag; do
            if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
              echo "Release tag $tag already exists and cannot be overwritten." >&2
              exit 1
            fi
            response_file="$RUNNER_TEMP/release-response"
            error_file="$RUNNER_TEMP/release-error"
            if gh api --include --silent \
              "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
              > "$response_file" 2> "$error_file"; then
              echo "GitHub Release $tag already exists and cannot be overwritten." >&2
              exit 1
            fi
            status="$(sed -n '1s/.* \([0-9][0-9][0-9]\).*/\1/p' "$response_file")"
            if [[ "$status" == "404" ]]; then
              continue
            fi
            echo "Unable to verify GitHub Release $tag (HTTP ${status:-unknown})." >&2
            cat "$error_file" >&2
            exit 1
          done < <(jq -r '.[].tag' <<< "$RELEASES")

  native:
    name: Native ${{ matrix.release.name }} (${{ matrix.release.platform }})
    needs: plan
    if: ${{ needs.plan.outputs.native != '[]' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.native) }}
    runs-on: ${{ matrix.release.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
          standalone: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify native release output
        run: pnpm turbo run release:native --filter="${{ matrix.release.name }}"

      - name: Archive native release output
        shell: bash
        env:
          NATIVE_PLATFORM: ${{ matrix.release.platform }}
          PLUGIN_PATH: ${{ matrix.release.path }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-artifact"
          tar -C "$PLUGIN_PATH/.native" -czf "$RUNNER_TEMP/native-artifact/$NATIVE_PLATFORM.tar.gz" "$NATIVE_PLATFORM"

      - name: Upload native release output
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.release.artifact }}
          path: ${{ runner.temp }}/native-artifact/${{ matrix.release.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package ${{ matrix.release.name }} ${{ matrix.release.version }}
    needs: [plan, native]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.plugins != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.plugins) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
          standalone: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native release output
        if: ${{ matrix.release.hasNative }}
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.release.nativeArtifactPattern }}
          path: ${{ runner.temp }}/native-artifacts
          merge-multiple: true

      - name: Restore native release output
        if: ${{ matrix.release.hasNative }}
        shell: bash
        env:
          EXPECTED_NATIVE_PLATFORMS: ${{ toJSON(matrix.release.nativePlatforms) }}
          PLUGIN_PATH: ${{ matrix.release.path }}
        run: |
          mkdir -p "$PLUGIN_PATH/.native"
          while IFS= read -r platform; do
            archive="$RUNNER_TEMP/native-artifacts/$platform.tar.gz"
            if [[ ! -f "$archive" ]]; then
              echo "Missing native release output for $platform" >&2
              exit 1
            fi
            tar -C "$PLUGIN_PATH/.native" -xzf "$archive"
          done < <(jq -r '.[]' <<< "$EXPECTED_NATIVE_PLATFORMS")

      - name: Stage native release output
        if: ${{ matrix.release.hasNative }}
        run: pnpm turbo run native:stage --filter="${{ matrix.release.name }}"

      - name: Build and package plugin
        run: pnpm turbo run pack --filter="${{ matrix.release.name }}"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER: ${{ matrix.release.path }}/${{ matrix.release.installer }}
          PLUGIN_NAME: ${{ matrix.release.name }}
          PLUGIN_VERSION: ${{ matrix.release.version }}
          PRERELEASE: ${{ matrix.release.prerelease }}
          RELEASE_NOTES: ${{ inputs.notes }}
          RELEASE_TAG: ${{ matrix.release.tag }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          if [[ -n "$RELEASE_NOTES" ]]; then
            printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          else
            printf '%s %s (%s)\n\nSource commit: `%s`\n' \
              "$PLUGIN_NAME" "$PLUGIN_VERSION" \
              "$([[ "$PRERELEASE" == "true" ]] && printf 'release candidate' || printf 'stable')" \
              "$SOURCE_SHA" > "$notes_file"
          fi

          release_args=(
            "$RELEASE_TAG"
            "$INSTALLER"
            --latest=false
            --notes-file "$notes_file"
            --repo "$GITHUB_REPOSITORY"
            --target "$SOURCE_SHA"
            --title "$PLUGIN_NAME $PLUGIN_VERSION"
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
